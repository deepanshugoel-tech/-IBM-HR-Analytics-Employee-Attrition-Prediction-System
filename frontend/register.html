<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Analytics | Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-logo">👤</div>
        <h1>Create Account</h1>
        <p class="auth-subtitle">AI-Powered HR Analytics System</p>

        <form id="registerForm">
            <label for="registerName">Full Name</label>
            <input type="text" id="registerName" placeholder="Enter your full name" maxlength="80" autocomplete="name" required>

            <label for="registerEmail">Email</label>
            <input type="email" id="registerEmail" placeholder="Enter your email" autocomplete="username" required>

            <label for="registerPassword">Password</label>
            <input type="password" id="registerPassword" placeholder="Create password (min 8 characters)" minlength="8" maxlength="128" autocomplete="new-password" required>

            <label for="registerRole">Select Role</label>
            <select id="registerRole" required>
                <option value="">Select Role</option>
                <option value="HR">HR</option>
                <option value="Employee">Employee</option>
            </select>

            <div id="inviteWrap" style="display:none;">
                <label for="registerInvite">HR Invite Code</label>
                <input type="password" id="registerInvite" placeholder="Enter HR invite code" autocomplete="off">
            </div>

            <button type="submit" class="auth-btn" id="registerBtn">Create Account</button>
        </form>

        <p id="registerMessage" class="auth-message"></p>

        <p class="auth-switch">
            Already have an account?
            <a href="login.html">Login</a>
        </p>
        <p class="auth-switch" style="margin-top:12px;">
            <a href="home.html">&larr; Back to company page</a>
        </p>
    </div>
</div>

<script>
var roleSelect = document.getElementById("registerRole");
var inviteWrap = document.getElementById("inviteWrap");
var inviteInput = document.getElementById("registerInvite");

var presetRole = new URLSearchParams(window.location.search).get("role");
if (presetRole === "hr" || presetRole === "employee") {
    roleSelect.value = presetRole === "hr" ? "HR" : "Employee";
}

roleSelect.addEventListener("change", function () {
    var isHR = roleSelect.value === "HR";
    inviteWrap.style.display = isHR ? "block" : "none";
    inviteInput.required = isHR;
});
roleSelect.dispatchEvent(new Event("change"));

document.getElementById("registerForm").addEventListener("submit", async function (event) {
    event.preventDefault();
    var message = document.getElementById("registerMessage");
    var btn = document.getElementById("registerBtn");
    btn.disabled = true;

    try {
        var res = await fetch("/auth/register", {
            method: "POST",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                name: document.getElementById("registerName").value.trim(),
                email: document.getElementById("registerEmail").value.trim(),
                password: document.getElementById("registerPassword").value,
                role: roleSelect.value,
                invite_code: inviteInput.value
            })
        });
        var data = await res.json().catch(function () { return {}; });

        if (!res.ok) {
            message.textContent = "❌ " + (typeof data.detail === "string" ? data.detail : "Could not create account.");
            message.className = "auth-message error";
            btn.disabled = false;
            return;
        }

        message.textContent = "✅ Account created successfully! Redirecting to login...";
        message.className = "auth-message success";
        setTimeout(function () { window.location.href = "login.html"; }, 1000);
    } catch (e) {
        message.textContent = "❌ Cannot reach the server. Please try again.";
        message.className = "auth-message error";
        btn.disabled = false;
    }
});
</script>
</body>
</html>
